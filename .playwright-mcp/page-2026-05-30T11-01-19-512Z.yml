                - generic [ref=e442]:
                    - generic [ref=e443]:
                        - heading "What is an AI front desk assistant and how does it work?" [level=3] [ref=e446] [cursor=pointer]
                        - generic [ref=e451]: An AI front desk assistant like Aimee automates routine communication tasks for dental and veterinary clinics. It answers calls, follows up with patients, and schedules appointments – all while integrating seamlessly with your existing systems.
                    - generic [ref=e453]:
                        - heading "How can Aimee help reduce missed calls and lost revenue?" [level=3] [ref=e456] [cursor=pointer]
                        - generic [ref=e461]: Aimee responds to missed calls automatically, follows up with patients, and books appointments in real-time – even after hours. This means fewer lost opportunities and more patients through your doors.
                    - generic [ref=e463]:
                        - heading "Is Peerlogic’s AI assistant available 24/7?" [level=3] [ref=e466] [cursor=pointer]
                        - generic [ref=e471]: Yes, Aimee is available around the clock. Whether your front desk is closed or your team is busy with in-office patients, Aimee ensures your practice never misses a chance to engage with a caller.
                    - generic [ref=e473]:
                        - heading "Can Aimee personalize patient interactions?" [level=3] [ref=e476] [cursor=pointer]
                        - generic [ref=e481]: Absolutely. Aimee accesses key patient data – like medical history and previous interactions – to deliver a tailored, human-like experience every time.
                    - generic [ref=e483]:
                        - heading "How quickly can we get started with Peerlogic?" [level=3] [ref=e486] [cursor=pointer]
                        - generic [ref=e491]: Right away. Peerlogic handles everything from setup to staff training. Most practices are up and running with Aimee in just a few days.
                    - generic [ref=e493]:
                        - heading "Does Peerlogic integrate with our current systems?" [level=3] [ref=e496] [cursor=pointer]
                        - generic [ref=e501]: Yes, Peerlogic is built to integrate smoothly with most major practice management systems.Our team works with you to ensure a seamless connection and zero disruption.
                    - generic [ref=e503]:
                        - heading "Is this solution suitable for both dental and veterinary practices?" [level=3] [ref=e506] [cursor=pointer]
                        - generic [ref=e511]: Yes, Aimee is designed to support the unique needs of both dental and veterinary clinics, offering industry-specific workflows and communication strategies.
                    - generic [ref=e513]:
