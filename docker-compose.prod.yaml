version: '3.9'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Image tags are set by the deploy workflow via environment variables:
#   SERVER_IMAGE=ghcr.io/org/dentora/server:<sha>
#   CLIENT_IMAGE=ghcr.io/org/dentora/client:<sha>
#   ADMIN_IMAGE=ghcr.io/org/dentora/admin:<sha>
# On a fresh server set these in .env.production with the :latest tag.

services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dentora}
      POSTGRES_USER: ${POSTGRES_USER:-dentora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dentora}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  # ── API Server ─────────────────────────────────────────
  server:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-dentora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dentora}'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY: ${TWILIO_API_KEY:-}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
      # AI providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Google OAuth + Calendar
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_OAUTH_SUCCESS_REDIRECT: ${GOOGLE_OAUTH_SUCCESS_REDIRECT:-}
      GOOGLE_OAUTH_ERROR_REDIRECT: ${GOOGLE_OAUTH_ERROR_REDIRECT:-}
      # Cloudflare R2 (phrase cache + file storage)
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://datadog-agent:4318}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PLATFORM_ENV: production
      PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
    labels:
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"dentora-api"}]'
    expose:
      - '3001'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
      replicas: ${SERVER_REPLICAS:-1}

  # ── BullMQ Worker ─────────────────────────────────────
  worker:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    command: ['node', 'apps/server/dist/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-dentora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dentora}'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://datadog-agent:4318}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PLATFORM_ENV: production
      PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
    labels:
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"dentora-worker"}]'
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Client (Next.js) ──────────────────────────────────
  client:
    image: ${CLIENT_IMAGE:?Set CLIENT_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Admin (Next.js) ───────────────────────────────────
  admin:
    image: ${ADMIN_IMAGE:?Set ADMIN_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - '3002'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3002']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Datadog Agent ─────────────────────────────────────
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    restart: unless-stopped
    logging: *default-logging
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: datadoghq.eu
      DD_ENV: production
      DD_SERVICE: dentora
      DD_VERSION: ${PLATFORM_VERSION:-0.1.0}
      DD_APM_ENABLED: 'true'
      DD_APM_NON_LOCAL_TRAFFIC: 'true'
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: 0.0.0.0:4317
      DD_LOGS_ENABLED: 'true'
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: 'true'
      DD_CONTAINER_EXCLUDE: 'name:datadog-agent'
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: 'false'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    expose:
      - '4317'
      - '4318'
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Nginx Reverse Proxy ────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Certbot (Let's Encrypt renewal) ───────────────────
  # First-time cert: bash scripts/bootstrap-ssl.sh app.dentora.com admin@dentora.com
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  letsencrypt:
    driver: local
  certbot-webroot:
    driver: local

networks:
  default:
    name: dentora
