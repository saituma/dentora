version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-tools:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "prettier"
          - "husky"
          - "lint-staged"
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
    ignore:
      # Major version bumps: review manually
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
