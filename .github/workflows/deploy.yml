name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client
  ADMIN_IMAGE: ghcr.io/${{ github.repository }}/admin

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /opt/dentora

            # Pull latest compose & config
            git pull origin master

            # Set image tags for this deploy
            export SERVER_IMAGE=${{ env.SERVER_IMAGE }}:${{ steps.sha.outputs.short }}
            export CLIENT_IMAGE=${{ env.CLIENT_IMAGE }}:${{ steps.sha.outputs.short }}
            export ADMIN_IMAGE=${{ env.ADMIN_IMAGE }}:${{ steps.sha.outputs.short }}

            # Load env (postgres/redis passwords, secrets)
            set -a; source .env.production; set +a

            # Re-export image tags (override any stale tags in .env.production)
            export SERVER_IMAGE CLIENT_IMAGE ADMIN_IMAGE

            # Log in to GHCR to pull private images
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # Pull new images
            docker compose -f docker-compose.prod.yaml pull server worker client admin

            # Rolling restart — server first (runs DB migrations on startup)
            docker compose -f docker-compose.prod.yaml up -d --no-deps server
            sleep 20

            # Health check — abort and keep old server if unhealthy
            if ! curl -sf http://localhost:3001/api/health; then
              echo "Server health check failed — aborting deploy"
              exit 1
            fi

            # Restart remaining services
            docker compose -f docker-compose.prod.yaml up -d --no-deps worker client admin nginx --remove-orphans

            # Final health check through nginx
            sleep 10
            curl -sf http://localhost/health || { echo "Nginx health check failed"; exit 1; }

            # Clean up old images (keep last 3)
            docker image prune -f --filter "until=72h"

            echo "Deploy successful: ${{ steps.sha.outputs.short }}"
