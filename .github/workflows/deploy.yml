name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /opt/dental-flow

            # Pull latest compose & config
            git pull origin main

            # Set image tags
            export SERVER_IMAGE=${{ env.SERVER_IMAGE }}:${{ steps.sha.outputs.short }}
            export CLIENT_IMAGE=${{ env.CLIENT_IMAGE }}:${{ steps.sha.outputs.short }}

            # Pull new images
            docker compose -f docker-compose.prod.yaml pull server worker client

            # Capture current image tags for rollback
            PREV_SERVER=$(docker inspect --format='{{index .RepoDigests 0}}' $(docker compose -f docker-compose.prod.yaml ps -q server) 2>/dev/null || echo "")

            # Migrations run automatically at server startup via drizzle migrate()

            # Rolling restart — server first (runs migrations), then worker, then client
            docker compose -f docker-compose.prod.yaml up -d --no-deps server
            sleep 15

            # Health check after server restart
            if ! curl -sf http://localhost:3001/api/health/ready; then
              echo "Server health check failed after restart — rolling back"
              docker compose -f docker-compose.prod.yaml up -d --no-deps server --scale server=0 || true
              exit 1
            fi

            docker compose -f docker-compose.prod.yaml up -d --no-deps worker client nginx --remove-orphans

            # Final health check via nginx
            sleep 10
            curl -sf https://localhost/api/health/ready || curl -sf http://localhost/api/health/ready || { echo "Final health check failed"; exit 1; }
            echo "Deploy successful: ${{ steps.sha.outputs.short }}"
