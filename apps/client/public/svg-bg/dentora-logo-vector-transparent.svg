<svg xmlns="http://www.w3.org/2000/svg" width="678" height="485" viewBox="0 0 678 485" role="img" aria-label="Dentora dental technology logo">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#122341"/>
      <stop offset="55%" stop-color="#081227"/>
      <stop offset="100%" stop-color="#030814"/>
    </radialGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="toothLine" x1="180" y1="65" x2="510" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dfffff"/>
      <stop offset="0.55" stop-color="#bcecff"/>
      <stop offset="1" stop-color="#9bd5ff"/>
    </linearGradient>
    <linearGradient id="word" x1="55" y1="410" x2="620" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8f5ff"/>
      <stop offset="1" stop-color="#b8d7ff"/>
    </linearGradient>
  </defs>

  <!-- Low-poly tooth network mark -->
